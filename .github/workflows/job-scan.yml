name: Job scan

# Weekly on Mondays at 11:00 UTC, plus on demand from the Actions tab or
# from the "Refresh now" button in the app, which dispatches this workflow.
#
# The schedule used to be deliberately absent: scoring is the only part with
# a running cost, and an unattended run spends quota without anyone there
# to look at the result. That trade no longer holds, for two reasons.
# First, a scan only scores postings it has never scored before, so a week
# with nothing new costs nothing but the fetches (plain page loads and API
# calls, no key, no quota, no bill). Second, every scheduled run now
# writes docs/weekly-digest.md, so the spend is always summarized somewhere
# a human will actually read it — the result is no longer fire-and-forget.
#
# The remaining staleness note still applies between runs: a list left
# alone for weeks goes quietly stale. Weekly runs bound that to a week,
# and the link-verification pass still hides anything that closed.
#
# FREE TIER: Gemini usage here must never charge. The scan's per-run LLM
# budget is MAX_SCORES_PER_RUN / SCORE_BATCH_SIZE (120 / 5 = at most 24
# requests), enforced by slicing before batching in run-job-scan.js — new
# sources can change which postings get scored, never how many. The digest
# step makes zero model calls (plain formatting of rows already scored).
on:
  schedule:
    - cron: '0 11 * * 1'   # Mondays 11:00 UTC
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Recorded in the run log (schedule | manual)'
        required: false
        default: 'manual'
        type: string
      max_scores:
        description: 'Cap on how many postings get scored this run'
        required: false
        default: '120'
        type: string
      batch_size:
        description: 'Postings assessed per LLM call (higher = fewer requests)'
        required: false
        default: '5'
        type: string
      max_link_checks:
        description: 'Cap on posting URLs fetched to confirm the role is still open (0 disables)'
        required: false
        # 600 covers the whole visible list with headroom. 150 left roughly
        # three-quarters of it unchecked, which is where the dead postings
        # were hiding. These are plain page loads — no key, no quota, no bill —
        # so the only cost of a high cap is scan time.
        default: '600'
        type: string

permissions:
  # Write (not just read) because the digest step commits
  # docs/weekly-digest.md back to this repo. Nothing else in this file
  # needs write access; the scan itself only reads Supabase and the feeds.
  contents: write

# The scan writes postings and matches; two overlapping runs would duplicate
# LLM spend on the same rows. Queue instead of racing.
concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Gemini is the required scorer. ANTHROPIC_API_KEY is an optional
          # upgrade — leave the secret unset and the scan runs entirely on the
          # Gemini free tier, with no paid Anthropic account involved.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          JSEARCH_RAPIDAPI_KEY: ${{ secrets.JSEARCH_RAPIDAPI_KEY }}
          SCAN_TRIGGER: ${{ inputs.trigger || 'schedule' }}
          MAX_SCORES_PER_RUN: ${{ inputs.max_scores || '120' }}
          SCORE_BATCH_SIZE: ${{ inputs.batch_size || '5' }}
          # Link verification: fetch the posting page for the roles that scored
          # well enough to be shown, and hide the ones that have already
          # closed. No API key and no quota — these are ordinary page loads.
          # The `||` fallback covers the scheduled run, which passes no inputs
          # at all. A manual dispatch — including the app's "Refresh now"
          # button, which sends only `trigger` — picks up the input default
          # above. Both paths land on the same number by design: the cap lives
          # in exactly one place.
          MAX_LINK_CHECKS_PER_RUN: ${{ inputs.max_link_checks || '600' }}
        run: node scripts/run-job-scan.js

      # Weekly digest: new roles above the display bar, as a plain file in
      # the repo (docs/weekly-digest.md). Deterministic formatting of rows
      # the scan already scored — zero model calls, so it adds nothing to
      # the free-tier budget. It reuses exactly the Supabase credentials
      # the scan step already uses; no new secrets. continue-on-error on
      # both steps, so a digest failure can never fail a scan whose
      # fetching and scoring already succeeded — and the default
      # if: success() means these steps are skipped entirely when the
      # scan itself fails, rather than digesting stale data.
      - name: Generate digest
        if: success()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-digest.js

      - name: Commit digest
        if: success()
        continue-on-error: true
        run: |
          # Only commit when the digest step actually produced a file. If
          # generation failed, the previous week's file stays as it is —
          # committing a stale digest as if it were new would be worse
          # than committing nothing.
          if [ -f docs/weekly-digest.md ]; then
            git config user.name "job-scan"
            git config user.email "job-scan@users.noreply.github.com"
            git add docs/weekly-digest.md
            git diff --cached --quiet || git commit -m "Weekly digest"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Job scan"
            echo ""
            echo "Trigger: \`${{ inputs.trigger || 'schedule' }}\`"
            echo ""
            echo "Results: https://jobs.imetrobert.com"
          } >> "$GITHUB_STEP_SUMMARY"
