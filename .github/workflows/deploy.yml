name: Deploy to GitHub Pages

# WHY "workflow_run" IS HERE, NOT JUST "push"
# Sync app code commits with the default GITHUB_TOKEN, and GitHub
# deliberately does not let a GITHUB_TOKEN push trigger other workflows —
# it's an anti-recursion safeguard, not a bug. That means the `push` trigger
# below never actually fired after a sync; only a manual run of this
# workflow did. workflow_run doesn't have that restriction, so this fires
# automatically whenever Sync app code finishes, whether or not it changed
# anything (a no-op rebuild is cheap; a stale site that silently never
# redeploys is the worse failure mode).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Sync app code']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Only skip on an explicit sync FAILURE — a successful sync (changed or
    # not) and both direct triggers (push, manual dispatch) should proceed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Which repo the in-app "Refresh now" button dispatches the scan to.
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
