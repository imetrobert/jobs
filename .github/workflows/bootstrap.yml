# Bootstrap: copy the job matcher app into this repo, once.
#
# WHY THIS EXISTS
# Uploading ~30 files through a phone browser doesn't work — mobile browsers
# silently skip folders whose names start with a dot, which is where the
# automation lives. So instead you paste in this one file, run it, and GitHub
# does the copying itself from inside its own network.
#
# HOW TO USE
#   1. In the `jobs` repo: Add file -> Create new file
#   2. Name it exactly:  .github/workflows/bootstrap.yml
#   3. Paste this whole file in, commit to main
#   4. Actions tab -> Bootstrap -> Run workflow
#   5. Wait ~1 minute, then refresh the repo. The files will be there.
#   6. Delete this workflow afterwards — it has done its job.
#
# It deliberately does NOT copy .github/workflows/. GitHub blocks the built-in
# Actions token from writing workflow files, by design. Those two files are
# copied by hand afterwards; the instructions cover it.

name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this (empty) repo
        uses: actions/checkout@v4

      - name: Fetch the app source
        uses: actions/checkout@v4
        with:
          repository: imetrobert/imetrobert.github.io
          ref: claude/personal-job-matcher-42xd2q
          path: .source

      - name: Copy the app to the root of this repo
        run: |
          set -euo pipefail
          test -d .source/jobs-app || { echo "Source folder missing"; exit 1; }

          # Trailing slash copies the CONTENTS, including dotfiles such as
          # .gitignore. .github is excluded on purpose (see header).
          rsync -a \
            --exclude '.github' \
            --exclude 'bootstrap-workflow.yml' \
            .source/jobs-app/ ./

          rm -rf .source
          echo "Copied:"
          ls -A

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Bootstrap"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit — already imported."
          else
            git commit -m "Import job matcher app"
            git push
          fi

      - name: What to do next
        run: |
          {
            echo "### Import finished"
            echo ""
            echo "Two files still need adding by hand — GitHub blocks this token"
            echo "from writing workflow files:"
            echo ""
            echo "- \`.github/workflows/deploy.yml\`"
            echo "- \`.github/workflows/job-scan.yml\`"
            echo ""
            echo "Copy each from the source repo, then delete this bootstrap workflow."
          } >> "$GITHUB_STEP_SUMMARY"
