name: Clean merged branches

# Manual only: Actions, Clean merged branches, Run workflow.
# Deletes a branch ONLY when no pull request from it is still open AND either (a) a pull request from it was merged
# and the branch still points at that exact commit, or (b) it has no commits of its own (all already in the default
# branch) and the default branch has moved on.
# Never touches the default branch, gh-pages, or protected branches. Set DRY_RUN to "true" to only list.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only, delete nothing (true/false)"
        default: "false"

permissions:
  contents: write
  pull-requests: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -u
          default=$(gh api "repos/$REPO" --jq .default_branch)
          gh api "repos/$REPO/pulls?state=closed&per_page=100" --paginate \
            --jq '.[] | select(.merged_at != null and .head.repo.full_name == "'"$REPO"'") | "\(.head.ref) \(.head.sha)"' | sort -u > merged.txt
          gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | select(.head.repo.full_name == "'"$REPO"'") | .head.ref' | sort -u > open.txt
          gh api "repos/$REPO/branches?per_page=100" --paginate --jq '.[] | select(.protected|not) | "\(.name) \(.commit.sha)"' > branches.txt
          del=0; keep=0
          while read -r name sha; do
            case "$name" in "$default"|main|master|gh-pages) continue;; esac
            if grep -qx -- "$name" open.txt; then echo "keep (open PR): $name"; keep=$((keep+1)); continue; fi
            if grep -qx -- "$name $sha" merged.txt; then
              if [ "$DRY" = "true" ]; then echo "would delete: $name"; else
                gh api -X DELETE "repos/$REPO/git/refs/heads/$name" >/dev/null && echo "deleted: $name"; fi
              del=$((del+1))
            else
              # No merged PR: still safe when the branch has no commits of its own (everything is already in the
              # default branch) AND the default branch has moved on (so a brand-new empty branch is never touched).
              ab=$(gh api "repos/$REPO/compare/$default...$name" --jq '"\(.ahead_by) \(.behind_by)"' 2>/dev/null || echo "x x")
              if [ "${ab% *}" = "0" ] && [ "${ab#* }" != "0" ] && [ "${ab#* }" != "x" ]; then
                if [ "$DRY" = "true" ]; then echo "would delete (already in $default): $name"; else
                  gh api -X DELETE "repos/$REPO/git/refs/heads/$name" >/dev/null && echo "deleted (already in $default): $name"; fi
                del=$((del+1))
              else
                echo "keep (has its own commits, or no merged PR): $name"; keep=$((keep+1))
              fi
            fi
          done < branches.txt
          echo "Done. Deleted/would delete: $del. Kept: $keep."
