name: Build check

# Runs on every pull request (including the monthly dependency updates): installs, builds,
# and runs this app's own tests. A green check means the update did not break the app.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
